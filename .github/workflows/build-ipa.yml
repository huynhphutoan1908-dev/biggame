name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications | grep '^Xcode_[0-9]' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build unsigned IPA
        run: |
          set +e
          make ipa > ../out.log 2>&1
          c=$?
          grep -h "error:" ../out.log | head -8 | tr '\n' '|' | sed 's/[^ -~]//g' > ../err.txt
          echo "::error file=Makefile,title=build exit=$c::$(cat ../err.txt)"
          exit $c

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: hi-ipa
          path: build/ipa/hi-unsigned.ipa
