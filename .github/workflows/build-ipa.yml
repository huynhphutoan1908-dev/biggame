name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: |
          set +e
          make ipa > ../out.log 2>&1
          c=$?
          tail -c 900 ../out.log | tr '\n' '|' | sed 's/[^ -~]//g' > ../err.txt
          echo "::error file=Makefile,title=build exit=$c::$(cat ../err.txt)"
          exit $c

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: hi-ipa
          path: build/ipa/hi-unsigned.ipa
