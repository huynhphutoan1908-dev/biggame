name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: make ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: hi-ipa
          path: build/ipa/hi-unsigned.ipa
